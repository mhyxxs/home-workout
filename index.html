<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0D0D12">
<title>Ama Fit</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0D0D12;--bgimg:radial-gradient(520px 340px at 90% -60px,rgba(71,117,255,.16),transparent 70%),radial-gradient(460px 320px at -12% 18%,rgba(155,123,255,.13),transparent 70%),#0D0D12;
  --card:#171720;--card2:#1F1F2B;--line:rgba(255,255,255,.06);--ov:rgba(255,255,255,.07);--glass:rgba(23,23,32,.72);
  --pri:#9B7BFF;--sec:#4775FF;--acc:#F04491;
  --text:#F5F5FB;--mid:#A9A9C2;--dim:#6C6C86;
  --c:var(--pri);--cg:rgba(155,123,255,.24);
  --ease:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.56,.64,1);
  --fh:'Space Grotesk',sans-serif;--fb:'Inter',sans-serif;--nav:70px;
}
[data-theme=midnight]{--bg:#0B1030;--bgimg:radial-gradient(520px 380px at 90% -40px,rgba(155,123,255,.28),transparent 70%),linear-gradient(165deg,#0B1032,#121A4E 60%,#1A1560);
  --card:rgba(255,255,255,.065);--card2:rgba(255,255,255,.11);--line:rgba(255,255,255,.09);--glass:rgba(18,24,70,.7);--dim:#7F86B0;--mid:#B7BCDD}
[data-theme=light]{--bg:#F3F3FA;--bgimg:radial-gradient(520px 340px at 90% -60px,rgba(71,117,255,.12),transparent 70%),#F3F3FA;
  --card:#FFFFFF;--card2:#ECECF6;--line:rgba(20,20,40,.07);--ov:rgba(20,20,40,.07);--glass:rgba(255,255,255,.78);--text:#14141F;--mid:#55556E;--dim:#8A8AA3}
[data-c=p]{--c:var(--sec);--cg:rgba(71,117,255,.24)}
[data-c=w]{--c:var(--acc);--cg:rgba(240,68,145,.24)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
html{background:var(--bg)}
body{font-family:var(--fb);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh;background:var(--bgimg);background-attachment:fixed;
  padding:clamp(18px,4vw,44px) clamp(14px,4vw,32px) 190px}
.wrap{max-width:560px;margin:0 auto}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:default}
h1,h2,h3,.num,.stats b,.pct{font-family:var(--fh)}
.view{display:none}.view.on{display:block;animation:up .45s var(--ease) both}
h1{font-size:clamp(28px,7vw,36px);font-weight:700;line-height:1.15;letter-spacing:-.01em}
.sub{color:var(--dim);font-size:14px;margin:6px 0 22px}
.card{background:var(--card);border-radius:20px;padding:18px 20px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.ttl{font-family:var(--fh);font-size:16px;font-weight:600}
.sec-t{display:flex;align-items:baseline;justify-content:space-between;margin:28px 2px 12px}
.sec-t small{color:var(--dim);font-size:12px}
.pct{font-size:24px;font-weight:700;color:var(--pri)}
.bar{height:6px;background:var(--ov);border-radius:9px;overflow:hidden;margin:10px 0 8px}
.bar i{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,var(--sec),var(--c));transition:width .6s var(--ease);animation:bg .8s var(--ease) backwards}
@keyframes bg{from{width:0}}
.wk .row span{color:var(--mid);font-size:13px}.wk small{color:var(--dim);font-size:12px}

/* welcome */
#welcome{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;justify-content:space-between;color:#fff;
  padding:max(64px,env(safe-area-inset-top)) 28px max(34px,env(safe-area-inset-bottom));
  background:radial-gradient(620px 440px at 85% 75%,rgba(155,123,255,.55),transparent 70%),radial-gradient(520px 420px at 0% 0%,rgba(71,117,255,.38),transparent 70%),linear-gradient(160deg,#0B1240,#161A5C 55%,#1E1670);
  transition:transform .75s var(--ease),opacity .5s}
#welcome.out{transform:translateY(-100%);opacity:0}
#welcome>*{max-width:520px;width:100%;margin-inline:auto}
#welcome>.logo{width:clamp(200px,58vw,260px);height:auto;filter:drop-shadow(0 10px 30px rgba(155,123,255,.55));animation:up .8s var(--ease) both}
.w-t{animation:up .8s .12s var(--ease) both}
.w-t h1{font-size:clamp(48px,15vw,68px);letter-spacing:-.02em;line-height:1.05}
.w-t p{color:rgba(255,255,255,.68);font-size:clamp(17px,4.6vw,21px);margin-top:12px;max-width:300px;line-height:1.4}
.w-b{animation:up .8s .26s var(--ease) both}
.gs{position:relative;overflow:hidden;width:100%;display:flex;align-items:center;justify-content:space-between;padding:20px 26px;border-radius:22px;font-family:var(--fh);font-weight:600;font-size:17px;color:#fff;
  background:linear-gradient(135deg,rgba(155,123,255,.9),rgba(71,117,255,.85));box-shadow:0 14px 34px rgba(71,117,255,.4),inset 0 1px 0 rgba(255,255,255,.3);transition:transform .16s var(--ease)}
.gs svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s var(--spring)}
.gs:hover svg{transform:translateX(4px)}.gs .ripple{background:#fff}
.w-b small{display:block;text-align:center;margin-top:16px;color:rgba(255,255,255,.5);font-size:12px}

/* home */
.plan{display:flex;align-items:center;gap:14px}
.pi{width:52px;height:52px;border-radius:16px;background:var(--cg);color:var(--c);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.pi svg{width:26px;height:26px}
.plan h3{font-size:19px;font-weight:600}.plan p{color:var(--mid);font-size:13px}
.go{position:relative;overflow:hidden;width:100%;margin-top:14px;padding:15px;border-radius:16px;background:linear-gradient(135deg,var(--c),var(--sec));color:#fff;font-family:var(--fh);font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 10px 26px var(--cg);transition:transform .16s var(--ease),opacity .3s}
.go .ripple{background:#fff}
.go:disabled{opacity:.5;box-shadow:none}
.go.run{background:var(--card2);color:var(--text);box-shadow:none}.go.run .ripple{background:var(--c)}
.go svg{width:16px;height:16px;fill:currentColor}
.plan-prog small{color:var(--dim);font-size:12px}

/* week + tabs */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dsq{--k:var(--pri);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;aspect-ratio:1/1.18;
  background:var(--card);border-radius:14px;color:var(--mid);transition:background .3s var(--ease),color .3s var(--ease),transform .16s var(--ease)}
.dsq[data-k=p]{--k:var(--sec)}.dsq[data-k=w]{--k:var(--acc)}.dsq[data-k=r]{--k:#55556B}
.dl{font-family:var(--fh);font-weight:600;font-size:12px}
.dk{font-size:9px;font-weight:500;color:var(--dim);letter-spacing:.04em}
.ic{height:14px;display:flex;align-items:center;justify-content:center}
.ic svg{width:13px;height:13px;stroke:var(--k);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.dsq.today .ic::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--k)}
.dsq.done .ic::before{display:none}
.dsq[data-k=r]{color:var(--dim)}
.dsq.sel{background:var(--k);color:#0D0D12;transform:translateY(-2px);box-shadow:0 8px 22px color-mix(in srgb,var(--k) 38%,transparent)}
.dsq.sel .dk{color:rgba(13,13,18,.65)}.dsq.sel .ic svg{stroke:#0D0D12}.dsq.sel.today .ic::before{background:#0D0D12}
.dsq[data-k=r].sel{background:#3A3A4D;color:#F5F5FB}.dsq[data-k=r].sel .dk{color:#A9A9C2}
.tabs{position:relative;display:grid;grid-template-columns:repeat(3,1fr);margin:22px 0 4px;border-bottom:1px solid var(--line)}
.tab{padding:13px 4px;font-family:var(--fh);font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);transition:color .3s var(--ease)}
.tab.on{color:var(--tc,var(--pri))}
.tab[data-t=a]{--tc:var(--pri)}.tab[data-t=p]{--tc:var(--sec)}.tab[data-t=w]{--tc:var(--acc)}
.ind{position:absolute;bottom:-1px;left:0;height:2px;width:0;border-radius:2px;background:var(--c);transition:left .4s var(--ease),width .4s var(--ease),background .3s;opacity:0}
.tabs.has .ind{opacity:1}

/* workout head */
.wh{margin:22px 0 6px}
.wh h2{font-size:clamp(22px,5.5vw,26px);font-weight:700}
.wh p{color:var(--mid);font-size:13px;margin-top:2px}
.badge{font-family:var(--fh);font-size:10px;font-weight:700;letter-spacing:.1em;padding:5px 10px;border-radius:99px;background:var(--cg);color:var(--c);white-space:nowrap}
.badge.ok{background:var(--ov);color:var(--text)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.stats div{background:var(--card);border-radius:14px;padding:12px 6px;text-align:center}
.stats b{display:block;font-size:19px;font-weight:600}.stats span{font-size:11px;color:var(--dim)}
.sh{display:flex;align-items:baseline;justify-content:space-between;margin:24px 2px 10px;color:var(--mid);font-family:var(--fh);font-weight:600;font-size:13px}
.sh small{font-family:var(--fb);font-weight:400;color:var(--dim);font-size:11px}
.note{font-size:12px;color:var(--dim);font-style:italic;margin:-4px 2px 10px}
.list{display:flex;flex-direction:column;gap:10px}
.ec{position:relative;overflow:hidden;background:var(--card);border-radius:18px;padding:14px 14px 12px;transition:transform .16s var(--ease),background .3s var(--ease),box-shadow .3s var(--ease)}
.ec-top{display:flex;align-items:flex-start;gap:12px;cursor:pointer}
.num{width:30px;height:30px;border-radius:10px;background:var(--cg);color:var(--c);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0;transition:transform .3s var(--spring)}
.info{flex:1;min-width:0}
.info h3{font-size:16px;font-weight:600;line-height:1.3}
.mus{font-size:12px;color:var(--dim);margin-top:1px}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--mid);margin-top:7px}
.meta b{font-family:var(--fh);font-weight:600;color:var(--text)}
.ck{width:38px;height:38px;flex-shrink:0;position:relative;border-radius:50%;overflow:hidden}
.ck svg{width:100%;height:100%;overflow:visible;position:relative}
.ck circle{fill:none;stroke-width:3;transform-box:fill-box;transform-origin:center;transform:rotate(-90deg)}
.ck .tr{stroke:var(--ov)}
.ck .pg{stroke:var(--c);stroke-linecap:round;transition:stroke-dashoffset .5s var(--ease)}
.ck path{fill:none;stroke:#0D0D12;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0;transition:opacity .3s}
.ck::before{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--c);transform:scale(0);transition:transform .35s var(--spring)}
.ec.full .ck::before{transform:scale(1)}.ec.full .ck path{opacity:1}
.prog{display:flex;align-items:center;gap:10px;margin-top:10px}
.prog .bar{flex:1;margin:0;height:4px}.prog em{font-style:normal;font-size:11px;color:var(--dim);white-space:nowrap}
.ec.full .prog em{color:var(--c)}
.chev{width:16px;height:16px;margin-top:3px;stroke:var(--dim);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;transition:transform .35s var(--spring)}
.ec.open .chev{transform:rotate(180deg)}
.det{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s var(--ease)}
.ec.open .det{grid-template-rows:1fr}
.det-in{overflow:hidden;min-height:0;opacity:0;transition:opacity .3s}
.ec.open .det-in{opacity:1}
.pills{display:flex;flex-wrap:wrap;gap:8px;padding-top:14px}
.pill{padding:8px 14px;border-radius:99px;background:var(--card2);color:var(--mid);font-size:12px;font-weight:500;transition:background .3s,color .3s,transform .16s var(--ease)}
.pill.on{background:var(--c);color:#0D0D12}
.dr{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:12px;font-size:12px;color:var(--mid)}
.btn{padding:8px 14px;border-radius:99px;background:var(--cg);color:var(--c);font-weight:600;font-size:12px;transition:transform .16s var(--ease)}

/* progress view */
.pr{display:flex;align-items:center;gap:20px}
.ringw{position:relative;width:112px;height:112px;flex-shrink:0}
.ringw svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringw circle{fill:none;stroke-width:9}
.ringw .t{stroke:var(--ov)}.ringw .p{stroke:var(--c);stroke-linecap:round;animation:rf 1s var(--ease) backwards}
@keyframes rf{from{stroke-dashoffset:276.5}}
.ringw b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--fh);font-size:24px;font-weight:700}
.pr h3{font-size:18px}.pr p{color:var(--mid);font-size:13px}
.chart{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;height:150px;align-items:end;margin-top:18px}
.bc{height:100%;display:flex;flex-direction:column;align-items:center;gap:8px;justify-content:flex-end}
.bw{flex:1;width:100%;display:flex;align-items:flex-end;background:var(--ov);border-radius:10px;overflow:hidden}
.bw i{display:block;width:100%;border-radius:10px;background:var(--k,var(--pri));transform-origin:bottom;animation:gr .8s var(--ease) backwards;animation-delay:calc(var(--i)*60ms)}
@keyframes gr{from{transform:scaleY(0)}}
.bc span{font-size:11px;color:var(--dim)}.bc.today span{color:var(--text);font-weight:600}
.pe{display:flex;align-items:center;gap:12px;padding:11px 0;font-size:14px}.pe+.pe{border-top:1px solid var(--line)}
.pe span{flex:1;min-width:0}.pe .bar{width:70px;margin:0;height:4px}.pe em{font-style:normal;font-size:12px;color:var(--dim);width:32px;text-align:right}

/* profile */
.av{width:76px;height:76px;border-radius:50%;background:linear-gradient(135deg,var(--pri),var(--sec));display:flex;align-items:center;justify-content:center;font-family:var(--fh);font-size:32px;font-weight:700;color:#fff;margin:0 auto 14px;box-shadow:0 10px 28px rgba(155,123,255,.35)}
.fld{display:block;font-size:12px;color:var(--dim);margin-bottom:6px}
.inp{width:100%;padding:13px 15px;border-radius:14px;border:1.5px solid transparent;background:var(--card2);color:var(--text);font:inherit;font-size:15px;outline:none;transition:border-color .3s}
.inp:focus{border-color:var(--pri)}
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;font-size:14px}.set+.set{border-top:1px solid var(--line)}
.set small{display:block;color:var(--dim);font-size:12px}
.sw{position:relative;width:48px;height:28px;border-radius:99px;background:var(--card2);flex-shrink:0;transition:background .3s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .35s var(--spring)}
.sw.on{background:var(--pri)}.sw.on::after{transform:translateX(20px)}
.ths{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.th{border-radius:16px;padding:10px 6px 9px;background:var(--card2);border:2px solid transparent;font-size:12px;color:var(--mid);display:flex;flex-direction:column;align-items:center;gap:8px;transition:border-color .3s,transform .16s var(--ease)}
.th i{width:100%;height:34px;border-radius:10px;border:1px solid var(--line)}
.th.on{border-color:var(--pri);color:var(--text)}
.danger{width:100%;margin-top:4px;padding:13px;border-radius:14px;background:rgba(240,68,145,.12);color:var(--acc);font-weight:600;font-size:14px}
.ver{text-align:center;color:var(--dim);font-size:12px;margin-top:22px}
.rules{margin-top:34px}.rules h3{font-size:15px;margin:0 2px 12px}
.rl{background:var(--card);border-radius:18px;padding:6px 18px}
.rl div{display:flex;justify-content:space-between;gap:12px;padding:12px 0;font-size:13px;color:var(--mid)}.rl div+div{border-top:1px solid var(--line)}
.rl b{font-family:var(--fh);font-weight:600;color:var(--text);text-align:right}
.restday{text-align:center;padding:34px 22px;margin-top:20px}.restday h3{font-size:20px;margin-bottom:6px}.restday p{color:var(--mid);font-size:13px}

/* bottom nav (glass) */
.nav{position:fixed;left:50%;bottom:max(12px,env(safe-area-inset-bottom));z-index:50;width:min(calc(100% - 24px),520px);height:var(--nav);padding:8px;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;
  background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,0) 60%),var(--glass);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);
  border:1px solid var(--line);border-radius:26px;box-shadow:0 14px 36px rgba(0,0,0,.35);transform:translate(-50%,220%);transition:transform .7s .25s var(--spring)}
body.in .nav{transform:translate(-50%,0)}
.nv{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:19px;color:var(--dim);font-size:10px;font-weight:500;transition:background .3s var(--ease),color .3s var(--ease),transform .16s var(--ease)}
.nv svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nv.on{background:var(--cg);color:var(--pri)}.nv.on svg{animation:pop .5s var(--spring)}

/* rest timer + toast */
.rest{position:fixed;left:50%;bottom:calc(var(--nav) + 20px + env(safe-area-inset-bottom));transform:translate(-50%,300%);z-index:40;pointer-events:none;width:min(calc(100% - 28px),520px);
  background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,0) 60%),var(--glass);backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);
  border:1px solid var(--line);border-radius:20px;padding:8px 12px 10px;box-shadow:0 16px 40px rgba(0,0,0,.35);transition:transform .5s var(--spring)}
.rest.on{transform:translate(-50%,0)}.rest .btn{pointer-events:auto}
.rest .t{font-family:var(--fh);font-size:22px;font-weight:700;min-width:58px}
.rest small{display:block;color:var(--dim);font-size:11px}
.rest .grow{flex:1;min-width:0}.rest .grow span{font-size:13px;font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rest .bar{margin:7px 0 0;height:4px}.rest .bar i{transition:width .3s linear;animation:none}
.rest.fin .t{color:var(--c)}
.toast{position:fixed;top:max(14px,env(safe-area-inset-top));left:50%;transform:translate(-50%,-160%);z-index:90;padding:11px 18px;border-radius:99px;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);font-size:13px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.35);transition:transform .5s var(--spring);max-width:calc(100% - 28px);text-align:center}
.toast.on{transform:translate(-50%,0)}

/* sticky bar set / reps / durasi */
html{scroll-padding-top:100px;scroll-padding-bottom:190px}
.sbar{position:sticky;top:max(10px,env(safe-area-inset-top));z-index:30;margin:18px 0 4px;padding:10px 12px 8px;border-radius:20px;background:var(--glass);backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.25)}
.sbar:empty{display:none}
.sbi{display:grid;grid-template-columns:1fr 1fr 1.25fr auto;gap:6px;align-items:center}
.sb{text-align:center;min-width:0}.sb b{display:block;font-family:var(--fh);font-size:18px;font-weight:600;line-height:1.2;font-variant-numeric:tabular-nums}.sb span{font-size:10px;color:var(--dim)}
.sbar .bar{margin:8px 2px 0;height:4px}
.sp{width:42px;height:42px;border-radius:50%;background:var(--c);color:#0D0D12;display:flex;align-items:center;justify-content:center;margin-left:4px;transition:transform .16s var(--ease),background .3s}
.sp svg{width:18px;height:18px;fill:currentColor}.sp.run{background:var(--card2);color:var(--text)}.sp:disabled{opacity:.55}.sp .ripple{background:#fff}.sp.is-pressed{transform:scale(.88)}
.times{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.times div{background:var(--card);border-radius:14px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between}
.card .times div{background:var(--card2)}
.times small{color:var(--dim);font-size:12px}.times b{font-family:var(--fh);font-weight:600;font-size:16px;font-variant-numeric:tabular-nums}
.rest .t{font-variant-numeric:tabular-nums}
.nv.live::after{content:"";position:absolute;top:9px;left:calc(50% + 8px);width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 2px var(--glass)}

/* micro interactions */
.ripple{position:absolute;border-radius:50%;pointer-events:none;background:var(--c);opacity:0;transform:scale(0);animation:rip .62s var(--ease) forwards}
@keyframes rip{0%{transform:scale(0);opacity:.32}100%{transform:scale(1);opacity:0}}
.dsq,.tab,.btn,.ck,.pill,.nv,.go,.gs,.th,.sw,.danger{position:relative;overflow:hidden}
.dsq.is-pressed,.nv.is-pressed{transform:scale(.9)}.tab.is-pressed{background:var(--ov)}
.btn.is-pressed,.ck.is-pressed,.pill.is-pressed,.th.is-pressed{transform:scale(.88)}.go.is-pressed,.gs.is-pressed,.danger.is-pressed{transform:scale(.97)}
.ec.is-pressed{transform:scale(.975);background:var(--card2);box-shadow:0 0 26px var(--cg)}.ec.is-pressed .num{transform:scale(.88)}
@media(hover:hover){.ec:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(0,0,0,.25)}.dsq:hover:not(.sel){background:var(--card2)}.tab:hover{color:var(--text)}.nv:hover:not(.on){color:var(--text)}}
.pop{animation:pop .48s var(--ease)}
.ec.pop{animation:pop .5s var(--ease),ring .65s var(--ease)}.ec.pop .num{animation:nb .55s var(--spring)}
@keyframes pop{0%{transform:scale(.95)}50%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes ring{0%{box-shadow:0 0 0 0 var(--cg)}100%{box-shadow:0 0 0 14px transparent}}
@keyframes nb{0%{transform:scale(.8) rotate(-10deg)}55%{transform:scale(1.18) rotate(5deg)}100%{transform:scale(1) rotate(0)}}
.rev .ec,.rev .sh{animation:up .42s var(--ease) backwards;animation-delay:calc(var(--i,0)*55ms)}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.sk{position:relative;overflow:hidden;display:block;background:var(--card2);border-radius:8px}
.sk::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 20%,rgba(255,255,255,.08) 50%,transparent 80%);transform:translateX(-100%);animation:sh 1.5s ease-in-out infinite}
@keyframes sh{to{transform:translateX(100%)}}
.skc{display:flex;gap:12px;background:var(--card);border-radius:18px;padding:14px}
.skc>.sk:first-child{width:30px;height:30px;border-radius:10px;flex-shrink:0}
.skc div{flex:1;display:flex;flex-direction:column;gap:9px;padding-top:3px}
</style>

    else{
      h+='<div class="card" data-c="'+k+'"><div class="pr"><div class="ringw"><svg viewBox="0 0 100 100"><circle class="t" cx="50" cy="50" r="44"/><circle class="p" cx="50" cy="50" r="44" stroke-dasharray="276.5" stroke-dashoffset="'+(276.5*(1-p/100))+'"/></svg><b>'+p+'%</b></div>'+
        '<div><h3>'+(dayDone(d)?'Sesi selesai':(run&&run.d===d?'Sedang berjalan':(S.acc[d]>0||t.x?'Dijeda':'Belum dimulai')))+'</h3><p>'+t.x+' dari '+t.t+' set</p><p>'+t.ed+' dari '+t.n+' latihan tuntas</p></div></div>'+
        '<div class="stats"><div><b>'+t.x+'</b><span>Set</span></div><div><b>'+repsOf(d)+'</b><span>Reps</span></div><div><b id="pdur">'+fmt(elapsed(d))+'</b><span>Durasi</span></div></div>'+
        '<div class="times" style="margin-top:8px"><div><small>Mulai</small><b>'+clock(S.t0[d])+'</b></div><div><small>Selesai</small><b>'+clock(S.t1[d])+'</b></div></div></div>';
    }
    h+='<div class="sec-t"><h2 class="ttl">Minggu Ini</h2><small>'+dn+'/'+SESS+' sesi · istirahat '+restCount()+'/'+RESTN+'</small></div><div class="card"><div class="chart">'+
      DAYS.map(function(x,i){var tt=totals(i),q=tt.t?Math.round(tt.x/tt.t*100):0,hh=x[2]==='r'?(restDone(i)?100:4):Math.max(q,4);
        return '<div class="bc'+(i===today?' today':'')+'"><div class="bw" style="--k:'+(x[2]==='p'?'var(--sec)':x[2]==='w'?'var(--acc)':x[2]==='r'?'#6C6C86':'var(--pri)')+'"><i style="--i:'+i+';height:'+hh+'%;'+(x[2]==='r'?(restDone(i)?'opacity:.55':'opacity:.3'):(!q?'opacity:.35':''))+'"></i></div><span>'+x[0]+'</span></div>'}).join('')+'</div></div>';
    if(k!=='r'){h+='<div class="sec-t"><h2 class="ttl">Rincian Latihan</h2></div><div class="card" data-c="'+k+'" style="padding:6px 20px">'+
      exOf(d).map(function(e,i){var v=done(d+'-'+i);return '<div class="pe"><span>'+e[0]+'</span><div class="bar"><i style="width:'+(v/e[1]*100)+'%"></i></div><em>'+v+'/'+e[1]+'</em></div>'}).join('')+'</div>'}
    $('#v-progress').innerHTML=h;
  }

  /* ── PROFILE ── */
  function renderProfile(){
    function sw(id,on){return '<button class="sw'+(on?' on':'')+'" data-sw="'+id+'" role="switch" aria-checked="'+on+'"></button>'}
    function th(id,n,bg){return '<button class="th'+(S2.theme===id?' on':'')+'" data-th="'+id+'"><i style="background:'+bg+'"></i>'+n+'</button>'}
    $('#v-profile').innerHTML='<h1>Profile</h1><p class="sub">Atur nama, preferensi, dan tampilan.</p>'+
      '<div class="card"><div class="av" id="av">'+esc((S2.name[0]||'A').toUpperCase())+'</div>'+
      '<label class="fld" for="nm">Nama panggilan (sapaan di Home)</label><input class="inp" id="nm" maxlength="14" value="'+esc(S2.name)+'" autocomplete="off"></div>'+
      '<div class="sec-t"><h2 class="ttl">Pengaturan</h2></div><div class="card" style="padding:4px 20px">'+
      '<div class="set"><div>Rest timer otomatis<small>Mulai hitung mundur tiap set dicatat</small></div>'+sw('auto',S2.auto)+'</div>'+
      '<div class="set"><div>Bunyi<small>Nada singkat saat waktu istirahat habis</small></div>'+sw('snd',S2.snd)+'</div>'+
      '<div class="set"><div>Tes bunyi<small>Dengarkan nada saat rest habis</small></div><button class="btn" id="tv">Coba</button></div></div>'+
      '<div class="sec-t"><h2 class="ttl">Tema</h2></div><div class="ths">'+th('dark','Gelap','#0D0D12')+th('midnight','Midnight','linear-gradient(135deg,#0B1032,#1A1560)')+th('light','Terang','#F3F3FA')+'</div>'+
      '<div class="sec-t"><h2 class="ttl">Data</h2></div><button class="danger" id="rst">Reset progres minggu ini</button><p class="ver">Ama Fit &middot; progres tersimpan di perangkat ini</p>';
  }
  $('#v-profile').addEventListener('input',function(e){
    if(e.target.id!=='nm')return;S2.name=e.target.value.trim()||'Ama';save2();$('#av').textContent=(S2.name[0]||'A').toUpperCase();
  });
  $('#v-profile').addEventListener('click',function(e){
    var s=e.target.closest('[data-sw]'),t=e.target.closest('[data-th]');
    if(s){S2[s.dataset.sw]=!S2[s.dataset.sw];save2();s.classList.toggle('on',S2[s.dataset.sw]);s.setAttribute('aria-checked',S2[s.dataset.sw])}
    if(t){S2.theme=t.dataset.th;save2();theme();document.querySelectorAll('.th').forEach(function(x){x.classList.toggle('on',x===t)})}
    if(e.target.closest('#tv'))testSound();
    if(e.target.closest('#rst')&&confirm('Hapus semua progres dan durasi minggu ini?')){run=null;S=fresh();save();shown=-1;toast('Progres minggu ini direset')}
  });

  /* ── nav + welcome ── */
  $('#nav').addEventListener('click',function(e){var b=e.target.closest('.nv');if(b&&b.dataset.v!==cur)view(b.dataset.v)});
  $('#gs').addEventListener('click',function(){
    setTimeout(function(){$('#welcome').classList.add('out');document.body.classList.add('in');setTimeout(function(){$('#welcome').style.display='none'},800)},reduce?0:180);
  });

  /* ── micro interaction: press, ripple, pop ── */
  var SEL='.dsq,.tab,.btn,.ck,.pill,.ec,.nv,.go,.gs,.th,.sw,.danger,.sp',host=null;
  function ripple(el,x,y){var r=el.getBoundingClientRect(),d=Math.max(r.width,r.height)*2,s=document.createElement('span');
    s.className='ripple';s.style.cssText='width:'+d+'px;height:'+d+'px;left:'+(x-r.left-d/2)+'px;top:'+(y-r.top-d/2)+'px';el.appendChild(s);setTimeout(function(){s.remove()},700)}
  document.addEventListener('pointerdown',function(e){
    var el=e.target.closest(SEL);if(!el||(e.pointerType==='mouse'&&e.button!==0))return;
    if(el.classList.contains('ec')&&e.target.closest('.det'))return;
    host=el;el.classList.add('is-pressed');if(!el.classList.contains('ec'))ripple(el,e.clientX,e.clientY);
  },{passive:true});
  function rel(){if(host){host.classList.remove('is-pressed');host=null}}
  document.addEventListener('pointerup',rel,{passive:true});document.addEventListener('pointercancel',rel,{passive:true});
  document.addEventListener('click',function(e){
    var el=e.target.closest(SEL);if(!el||(el.classList.contains('ec')&&e.target.closest('.det')))return;
    el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop');clearTimeout(el._p);el._p=setTimeout(function(){el.classList.remove('pop')},700);
  });
  addEventListener('resize',markTabs);

  /* ── mulai ── */
  theme();renderHome();sessUI();
  var dkey=now.toDateString();
  function dayChk(){if(new Date().toDateString()!==dkey)location.reload()}
  setInterval(dayChk,30000);document.addEventListener('visibilitychange',dayChk);
  if(document.fonts)document.fonts.ready.then(markTabs);
})();
</script>
</body>
</html>
